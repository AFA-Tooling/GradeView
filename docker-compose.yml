version: '3.8'
# Production stack for gradeview.eecs.berkeley.edu (see docs/DEPLOY.md).
# Only the reverse proxy publishes host ports (80 and 443). Redis, the API,
# the web server and the progress report are reachable only on the internal
# Docker networks. For local development use docker-compose.dev.yml.
# Every service has `restart: unless-stopped`, so the stack comes back after a
# reboot or a Docker restart (the Docker service must start at boot). After
# `docker compose down` nothing runs until the next `make docker`.
services:
  reverseProxy:
    container_name: gradeview-reverse-proxy
    image: ${CI_REGISTRY_IMAGE:-gradeview}/reverse-proxy:${REVERSE_PROXY_VERSION:-development}
    build: ./reverseProxy
    environment:
      # Must match the certificate name under /etc/letsencrypt/live/.
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-gradeview.eecs.berkeley.edu}
    volumes:
      - ${SOCKETS_DIR:-/dev/null}:/run/sockets
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - frontend
      - concept_map_integration
    ports:
      - 80:80
      - 443:443
    depends_on:
      - web
      - api
      - dtgui-progress-report
    restart: unless-stopped
  web:
    container_name: gradeview-web
    image: ${CI_REGISTRY_IMAGE:-gradeview}/web:${WEB_VERSION:-development}
    build: ./website/server
    environment:
      # Target of the web container's own /api proxy (nginx sends /api straight to the API).
      - REACT_APP_PROXY_SERVER=${REACT_APP_PROXY_SERVER:-http://api:8000}
      - PORT=${REACT_APP_PORT}
      # Express (and its default error pages) in production mode: no stack traces.
      - NODE_ENV=production
    networks:
      - frontend
    command: npm start
    restart: unless-stopped
  api:
    container_name: gradeview-api
    image: ${CI_REGISTRY_IMAGE:-gradeview}/server:${API_VERSION:-development}
    build: ./api
    volumes:
      - ./api:/api
      - /api/node_modules
    environment:
      - PORT=${API_PORT}
      - NODE_ENV=production
      # Same value Redis is started with, so the API can always authenticate.
      - REDIS_DB_SECRET=${REDIS_DB_SECRET:?Set REDIS_DB_SECRET in the root .env file (see docs/DEPLOY.md)}
    networks:
      - frontend
      - db
    command: npm start
    restart: unless-stopped
  dtgui-progress-report:
    container_name: dtgui-progress-report
    image: ${CI_REGISTRY_IMAGE:-dtgui}/progress-report:${PROGRESS_REPORT_VERSION:-development}
    build: ./progressReport
    environment:
      # nginx proxies /progress to dtgui-progress-report:8080, so keep this at 8080.
      - LISTEN_PORT=${PROGRESS_REPORT_PORT:-8080}
    networks:
      - concept_map_integration
    # No host port: only nginx (on concept_map_integration) talks to it.
    restart: unless-stopped
  redis:
    image: redis:7.4.11-alpine3.21
    networks:
      - db
    # No host port: the API and dbcron reach redis:6379 over the internal `db` network.
    command: ["redis-server", "--requirepass", "${REDIS_DB_SECRET:?Set REDIS_DB_SECRET in the root .env file (see docs/DEPLOY.md)}"]
    restart: unless-stopped
  dbcron:
    build: ./dbcron
    volumes:
      # dbcron/.env (SERVER_HOST=redis, REDIS_DB_SECRET, ...) arrives through this mount.
      - ./dbcron:/dbcron
    networks:
      - db
    depends_on:
      - redis
    restart: unless-stopped
networks:
  frontend:
    name: frontend
  concept_map_integration:
    name: concept_map_integration
  db:
    name: db
