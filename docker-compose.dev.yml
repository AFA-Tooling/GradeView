version: '3.8'
# Local development stack (make dev-up). Plain HTTP, and by default every
# published port is bound to 127.0.0.1 so nothing is reachable from the rest of
# the network (DEV_PROXY_BIND in .env can change the proxy's binding).
services:
  reverseProxy:
    container_name: gradeview-reverse-proxy
    image: ${CI_REGISTRY_IMAGE:-gradeview}/reverse-proxy:${REVERSE_PROXY_VERSION:-development}
    build: ./reverseProxy
    volumes:
      - ${SOCKETS_DIR:-/dev/null}:/run/sockets
    environment:
      # HTTP-only template; the image default is the production HTTPS template.
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx/templates/development
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-gradeview.eecs.berkeley.edu}
    networks:
      - frontend
      - concept_map_integration
    ports:
      # host address:port for the dev proxy (default http://localhost:80).
      # The old REVERSE_PROXY_LISTEN variable (0.0.0.0:80 in old .env files) is
      # deliberately not read, so stale values cannot expose the proxy.
      - ${DEV_PROXY_BIND:-127.0.0.1:80}:80
    depends_on:
      - web
      - api
      - dtgui-progress-report
  web:
    container_name: gradeview-web
    image: ${CI_REGISTRY_IMAGE:-gradeview}/web:${WEB_VERSION:-development}
    build: ./website/server
    volumes:
      - ./website/server/build:/website/build
    environment:
      - REACT_APP_PROXY_SERVER=${REACT_APP_PROXY_SERVER:-http://api:8000}
      - PORT=${REACT_APP_PORT}
      - NODE_ENV=production
    networks:
      - frontend
    command: npm start
    restart: unless-stopped
  api:
    container_name: gradeview-api
    image: ${CI_REGISTRY_IMAGE:-gradeview}/server:${API_VERSION:-development}
    build: ./api
    volumes:
      - ./api:/api
      - /api/node_modules
    environment:
      - PORT=${API_PORT}
      - NODE_ENV=production
      - REDIS_DB_SECRET=${REDIS_DB_SECRET:?Set REDIS_DB_SECRET in the root .env file (cp .env.example .env)}
    networks:
      - frontend
      - db
    command: npm run dev
    restart: unless-stopped
  dtgui-progress-report:
    container_name: dtgui-progress-report
    image: ${CI_REGISTRY_IMAGE:-dtgui}/progress-report:${PROGRESS_REPORT_VERSION:-development}
    build: ./progressReport
    environment:
      # nginx proxies /progress to dtgui-progress-report:8080, so keep this at 8080.
      - LISTEN_PORT=${PROGRESS_REPORT_PORT:-8080}
    networks:
      - concept_map_integration
    ports:
      - 127.0.0.1:8080:${PROGRESS_REPORT_PORT:-8080}
    restart: unless-stopped
  redis:
    image: redis:7.4.11-alpine3.21
    networks:
      - db
    command: ["redis-server", "--requirepass", "${REDIS_DB_SECRET:?Set REDIS_DB_SECRET in the root .env file (cp .env.example .env)}"]
    ports:
      # localhost only: `make dev-local` runs the API on the host against localhost:6379
      - 127.0.0.1:6379:6379
  dbcron:
    build: ./dbcron
    volumes:
      - ./dbcron:/dbcron
    networks:
      - db
    depends_on:
      - redis
networks:
  frontend:
    name: frontend
  concept_map_integration:
    name: concept_map_integration
  db:
    name: db
